    <style>
        :root {
            --bg-dark: #080b10;
            --card-bg: #0f1520;
            --neon-green: #00ff66;
            --neon-green-glow: rgba(0, 255, 102, 0.35);
            --telegram-blue: #0088cc;
            --telegram-glow: rgba(0, 136, 204, 0.6);
            --gold: #ffcc00;
            --cyber-blue: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --border-color: #1e2a3b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        body {
            padding: 12px 10px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(0, 136, 204, 0.08) 0%, transparent 60%);
        }

        /* Fluid Main Container */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 20px;
            padding: clamp(16px, 5vw, 24px);
            box-shadow: 0 0 25px var(--neon-green-glow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Brand Header & Hero Title */
        .brand-header {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(22px, 6vw, 28px);
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }

        .hero-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(28px, 8vw, 38px);
            font-weight: 900;
            color: var(--neon-green);
            text-transform: uppercase;
            text-shadow: 0 0 16px var(--neon-green-glow);
            line-height: 1.05;
            margin-top: 2px;
        }

        .sub-tag {
            background: var(--neon-green);
            color: #000000;
            font-weight: 900;
            font-size: clamp(11px, 3.4vw, 13px);
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin: 10px 0 16px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px var(--neon-green-glow);
        }

        /* ID Visual Component */
        .id-card {
            background: linear-gradient(135deg, #16202e 0%, #0d131c 100%);
            border: 1px solid var(--neon-green);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.08);
        }

        .id-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .verified-badge {
            color: var(--neon-green);
            font-size: 12px;
            border: 1px solid var(--neon-green);
            padding: 3px 9px;
            border-radius: 12px;
            background: rgba(0, 255, 102, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .id-subtext {
            font-size: clamp(11px, 3.2vw, 13px);
            color: var(--neon-green);
            margin-top: 8px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* Tiers List */
        .tier-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tier-item {
            background: #141c28;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--neon-green);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 52px;
        }

        .tier-left {
            text-align: left;
        }

        .tier-percent {
            font-size: clamp(16px, 4.8vw, 19px);
            font-weight: 900;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            line-height: 1;
        }

        .tier-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .tier-value {
            font-size: clamp(15px, 4.5vw, 18px);
            font-weight: 900;
            color: var(--neon-green);
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
        }

        /* Feature Grid 2x2 */
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }

        .feature-box {
            background: #121924;
            border: 1px solid var(--border-color);
            padding: 10px 8px;
            border-radius: 8px;
            font-size: clamp(10px, 2.9vw, 11px);
            font-weight: 700;
            color: #d1d5db;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 56px;
            text-transform: uppercase;
        }

        .feature-box i {
            color: var(--neon-green);
            font-size: 16px;
            margin-bottom: 4px;
        }

        /* Telegram CTA Button */
        .cta-wrapper {
            width: 100%;
            margin-top: 4px;
        }

        .btn-telegram-large {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            min-height: 58px;
            padding: 14px 18px;
            border-radius: 14px;
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(18px, 5.5vw, 22px);
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, #0088cc 0%, #00a6ff 100%);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px var(--telegram-glow);
            border: 1px solid #33b5ff;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            animation: pulse-glow 2.2s infinite ease-in-out;
        }

        .btn-telegram-large i {
            font-size: clamp(22px, 6vw, 26px);
        }

        /* Active / Touch State Feedback */
        .btn-telegram-large:active {
            transform: scale(0.96) translateY(2px);
            box-shadow: 0 0 10px var(--telegram-glow);
            filter: brightness(0.9);
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 12px rgba(0, 136, 204, 0.4);
            }
            50% {
                box-shadow: 0 0 28px rgba(0, 166, 255, 0.9);
            }
            100% {
                box-shadow: 0 0 12px rgba(0, 136, 204, 0.4);
            }
        }

        /* Mobile Adjustments for ultra-small screens */
        @media (max-width: 360px) {
            .container {
                padding: 14px 10px;
            }
            .tier-item {
                padding: 8px 10px;
            }
            .feature-box {
                font-size: 9px;
            }
        }
    </style>
